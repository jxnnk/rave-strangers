name: rave_strangers
description: Rave Strangers – die Techno-Community-App für Deutschland.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  apple_maps_flutter: ^1.4.0 # iPhone/iPad map (native MapKit), unused on Android
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  geolocator: ^13.0.2 # 'Meine Stadt finden' (one-time, coarse)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
