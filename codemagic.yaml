# Codemagic: iOS-Build ohne Mac -> TestFlight
# Einrichtung: siehe IOS_BETA.md
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: flutter_app
    integrations:
      app_store_connect: Rave Strangers ASC   # Name des API-Keys in Codemagic > Team integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.ravestrangers.raveStrangers
      vars:
        BUNDLE_ID: de.ravestrangers.raveStrangers
        APP_STORE_APPLE_ID: "0000000000"   # Apple ID der App aus App Store Connect (App-Informationen) eintragen
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: iOS-Ordner erzeugen (nicht im Repo)
        script: |
          flutter create . --org de.ravestrangers --project-name rave_strangers --platforms ios
      - name: Info.plist ergänzen
        script: |
          P=ios/Runner/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$P"; }
          pb CFBundleDisplayName string "Rave Strangers"
          pb UIUserInterfaceStyle string Dark
          pb ITSAppUsesNonExemptEncryption bool false
          pb NSLocationWhenInUseUsageDescription string "Nur um die Stadt mit Events in deiner Nähe zu finden. Dein Standort wird nicht gespeichert."
          pb NSPhotoLibraryUsageDescription string "Damit du ein Profilbild aus deiner Galerie auswählen kannst."
          pb NSCameraUsageDescription string "Damit du ein Profilbild aufnehmen kannst."
          pb NSMicrophoneUsageDescription string "Rave Strangers nimmt keinen Ton auf. Dieser Text ist für das Foto-Modul vorgeschrieben."
          plutil -lint "$P"
      - name: Pakete
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Signing-Profile setzen
        script: xcode-project use-profiles
      - name: IPA bauen
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-name=0.1.0 \
            --build-number=$((LAST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Public Beta     # externe Gruppe in App Store Connect, exakt so benennen
