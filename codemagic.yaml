# Codemagic: iOS-Build ohne Mac -> TestFlight
# Einrichtung: siehe IOS_BETA.md
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: flutter_app
    integrations:
      app_store_connect: Rave Strangers ASC   # Name des API-Keys in Codemagic > Team integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.ravestrangers.raveStrangers
      vars:
        BUNDLE_ID: de.ravestrangers.raveStrangers
        APP_STORE_APPLE_ID: "0000000000"   # Apple ID der App aus App Store Connect (App-Informationen) eintragen
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - name: iOS-Projekt vorbereiten (Icon, Info.plist, Privacy Manifest, iPhone/Hochformat)
        script: |
          flutter pub get
          bash tool/prepare_ios.sh
      - name: Pods (falls das Projekt CocoaPods nutzt)
        script: |
          if [ -f ios/Podfile ]; then cd ios && pod install --repo-update; fi
      - name: Analyse + Tests
        script: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Signing-Profile setzen
        script: xcode-project use-profiles
      - name: IPA bauen
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          flutter build ipa --release \
            --build-name=$VERSION \
            --build-number=$((LAST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Public Beta     # externe Gruppe in App Store Connect, exakt so benennen
